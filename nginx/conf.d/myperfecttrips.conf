# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name myperfecttrips.com www.myperfecttrips.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://myperfecttrips.com$request_uri;
    }
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.myperfecttrips.com;

    ssl_certificate /etc/letsencrypt/live/myperfecttrips.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myperfecttrips.com/privkey.pem;

    return 301 https://myperfecttrips.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myperfecttrips.com;

    # SSL certificates (Let's Encrypt via Certbot)
    ssl_certificate /etc/letsencrypt/live/myperfecttrips.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myperfecttrips.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myperfecttrips.com/chain.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS (31536000 = 1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;

    # Rate limiting
    limit_req zone=general burst=50 nodelay;

    # Proxy to Next.js app
    location / {
        proxy_pass http://myperfecttrips:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API endpoints — stricter rate limiting, no caching
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://myperfecttrips:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Cache Next.js static assets (immutable)
    location /_next/static/ {
        proxy_pass http://myperfecttrips:3000;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        proxy_cache_valid 200 1y;
    }

    # Cache public static files
    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|otf|css|js)$ {
        proxy_pass http://myperfecttrips:3000;
        add_header Cache-Control "public, max-age=2592000" always;
        expires 30d;
    }

    # Block sensitive files
    location ~ /\. {
        deny all;
        return 404;
    }
    location ~ \.(env|log|sh|sql|bak)$ {
        deny all;
        return 404;
    }
}
