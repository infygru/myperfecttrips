services:

  database:
    image: postgres:15
    volumes:
      - ./backend/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: "directus"
      POSTGRES_PASSWORD: "directus_password"
      POSTGRES_DB: "directus"

  directus:
    image: directus/directus:latest
    ports:
      - 8055:8055
    volumes:
      - ./backend/uploads:/directus/uploads
      - ./backend/extensions:/directus/extensions
    depends_on:
      - database
    environment:
      KEY: "b4c9e8cd-2f3b-4c01-8b06-4b8c9e8cd2f3"
      SECRET: "e8cd2f3b-4c01-8b06-4b8c-9e8cd2f3b4c0"
      ADMIN_EMAIL: "admin@igholidays.com"
      ADMIN_PASSWORD: "Admin123!"
      DB_CLIENT: "pg"
      DB_HOST: "database"
      DB_PORT: "5432"
      DB_DATABASE: "directus"
      DB_USER: "directus"
      DB_PASSWORD: "directus_password"
      WEBSOCKETS_ENABLED: "true"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:3000"
