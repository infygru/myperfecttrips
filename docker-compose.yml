version: '3.8'

# Coolify-compatible Docker Compose
# Coolify's built-in Traefik proxy handles:
#   - SSL termination (Let's Encrypt)
#   - Domain routing (myperfecttrips.com)
#   - Port mapping from the outside world
# So this file only defines the app service — no nginx needed.

services:
  myperfecttrips:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
