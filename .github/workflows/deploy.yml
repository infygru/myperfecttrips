name: CI Checks

# Coolify watches this repo and auto-deploys on push to main.
# This workflow only runs build/lint checks so you catch errors
# before Coolify picks up the commit.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        env:
          NEXT_PUBLIC_DIRECTUS_URL: ${{ secrets.NEXT_PUBLIC_DIRECTUS_URL }}
          NEXT_PUBLIC_SITE_URL: https://myperfecttrips.com
          DIRECTUS_API_TOKEN: ${{ secrets.DIRECTUS_API_TOKEN }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
